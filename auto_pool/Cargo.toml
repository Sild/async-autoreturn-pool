[package]
name = "auto_pool"
readme = "README.md"
version = "0.3.4"
description = "A simple pool that returns items automatically after it's dropped"
keywords = ["pool", "object-pool", "autoreturn"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = true

[features]
async = ["dep:smol", "dep:event-listener"]

[dependencies]
parking_lot = "0.12"
event-listener = { version = "5.4", optional = true }
smol = { version = "2.0", optional = true }
rand = "0.10.0"

[dev-dependencies]
criterion = { version = "0.8" }
anyhow = "1.0"
tokio = { version = "1.43.0", features = ["rt", "macros"] }

[[bench]]
name = "multithread_push_pop"
harness = false
